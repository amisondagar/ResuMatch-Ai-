{% extends "base.html" %}
{% block title %}Register — ResumeMatch.ai{% endblock %}
{% block guest_content %}
<style>
 .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
 .auth-card { width:100%; max-width:500px; padding:44px; background:rgba(255,255,255,0.05); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.1); border-radius:24px; box-shadow:0 24px 64px rgba(0,0,0,0.4); }
 .auth-logo-icon { width:64px; height:64px; background:linear-gradient(135deg,#6366f1,#06b6d4); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 16px; box-shadow:0 12px 30px rgba(99,102,241,0.4); }
 .auth-title { font-size:1.6rem; font-weight:800; margin-bottom:4px; text-align:center; }
 .auth-sub { color:var(--text-muted); font-size:0.875rem; text-align:center; margin-bottom:32px; }
 .input-icon-wrap { position:relative; }
 .input-icon-wrap .form-control { padding-left:44px; }
 .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); pointer-events:none; }
 .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
 .auth-footer { text-align:center; margin-top:20px; font-size:0.875rem; color:var(--text-muted); }
 .auth-footer a { color:var(--primary-light); font-weight:600; }
</style>

<div class="auth-page">
 <div class="auth-card">
 <div style="text-align:center;margin-bottom:32px">
 <div class="auth-title">Create Your Account</div>
 <div class="auth-sub">Start screening smarter in seconds</div>
 </div>

 <form method="POST" action="{{ url_for('auth.register') }}" class="loading-form">
 <div class="form-row">
 <div class="form-group">
 <label class="form-label" for="full_name">Full Name</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="text" id="full_name" name="full_name" class="form-control"
 placeholder="John Doe" value="{{ full_name or '' }}">
 </div>
 </div>
 <div class="form-group">
 <label class="form-label" for="username">Username</label>
 <div class="input-icon-wrap">
 <span class="input-icon">@</span>
 <input type="text" id="username" name="username" class="form-control"
 placeholder="johndoe" value="{{ username or '' }}" required>
 </div>
 </div>
 </div>

 <div class="form-group">
 <label class="form-label" for="email">Email Address</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="email" id="email" name="email" class="form-control"
 placeholder="you@company.com" value="{{ email or '' }}" required>
 </div>
 </div>

 <div class="form-group">
 <label class="form-label" for="company">Company / Organisation</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="text" id="company" name="company" class="form-control"
 placeholder="Acme Corp (optional)" value="{{ company or '' }}">
 </div>
 </div>

 <div class="form-row">
 <div class="form-group">
 <label class="form-label" for="password">Password</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="password" id="password" name="password" class="form-control"
 placeholder="Min 8 characters" required>
 </div>
 </div>
 <div class="form-group">
 <label class="form-label" for="confirm_password">Confirm Password</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="password" id="confirm_password" name="confirm_password" class="form-control"
 placeholder="Repeat password" required>
 </div>
 </div>
 </div>
 <div class="form-hint" style="margin-top:-12px;margin-bottom:16px">Password must be at least 8 characters with letters and numbers.</div>

 <button type="submit" class="btn btn-primary w-full" style="justify-content:center">
 Create Free Account
 </button>
 </form>

 <div class="auth-footer">
 Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
 </div>
 <div style="margin-top:16px">
 <a href="/" class="btn btn-secondary w-full" style="justify-content:center;font-size:0.85rem">← Back to Home</a>
 </div>
 </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
