{% extends "base.html" %}
{% block title %}Reset Password — ResumeMatch.ai{% endblock %}
{% block guest_content %}
<style>
 .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
 .auth-card{width:100%;max-width:420px;padding:44px;background:rgba(255,255,255,0.05);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.4)}
 .input-icon-wrap{position:relative}.input-icon-wrap .form-control{padding-left:44px}
 .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
</style>
<div class="auth-page">
 <div class="auth-card">
 <div style="text-align:center;margin-bottom:32px">
 <div style="font-size:1.5rem;font-weight:800;margin-bottom:8px">Set New Password</div>
 <div style="color:var(--text-muted);font-size:0.875rem">Choose a strong password for your account.</div>
 </div>
 <form method="POST" action="{{ url_for('auth.reset_password') }}" class="loading-form">
 <div class="form-group">
 <label class="form-label">New Password</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
 </div>
 </div>
 <div class="form-group">
 <label class="form-label">Confirm Password</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
 </div>
 </div>
 <button type="submit" class="btn btn-primary w-full" style="justify-content:center">Update Password</button>
 </form>
 </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
