{% extends "base.html" %}
{% block title %}Login — ResumeMatch.ai{% endblock %}
{% block guest_content %}
<style>
  .auth-page {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    background: #0b0b14;
  }
  .glass-orb-1 {
    position: absolute; top: 15%; left: 20%;
    width: 350px; height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.45) 0%, rgba(99,102,241,0) 70%);
    filter: blur(50px);
    animation: orbFloat 10s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .glass-orb-2 {
    position: absolute; bottom: 15%; right: 20%;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6,182,212,0.35) 0%, rgba(6,182,212,0) 70%);
    filter: blur(60px);
    animation: orbFloat 12s ease-in-out infinite alternate-reverse;
    pointer-events: none;
  }
  @keyframes orbFloat {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, -40px) scale(1.1); }
  }

  .auth-card {
    width: 100%; max-width: 440px;
    padding: 44px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(35px) saturate(180%);
    -webkit-backdrop-filter: blur(35px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 28px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    position: relative;
    z-index: 10;
  }
  .auth-logo { text-align: center; margin-bottom: 32px; }
  .auth-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.02em; }
  .auth-sub { color: var(--text-muted); font-size: 0.875rem; }
  .input-icon-wrap { position: relative; }
  .input-icon-wrap .form-control {
    padding: 14px 18px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    color: #fff;
    font-size: 0.92rem;
  }
  .input-icon-wrap .form-control:focus {
    border-color: #818cf8;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
  }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 0.875rem; color: var(--text-muted); }
  .auth-footer a { color: #818cf8; font-weight: 600; }
  .auth-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
  .auth-divider span { color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; }
  .auth-divider::before,.auth-divider::after { content:''; flex:1; height:1px; background:rgba(255, 255, 255, 0.12); }
</style>

<div class="auth-page">
  <div class="glass-orb-1"></div>
  <div class="glass-orb-2"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to your ResumeMatch.ai account</div>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}" class="loading-form">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-icon-wrap">
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="you@company.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <label class="form-label" for="password" style="margin:0">Password</label>
          <a href="{{ url_for('auth.forgot_password') }}" style="font-size:0.8rem;color:#818cf8">Forgot password?</a>
        </div>
        <div class="input-icon-wrap">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="Your password" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;justify-content:center;padding:14px;border-radius:12px;font-size:0.95rem">
        Sign In
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create one free</a>
    </div>

    <div class="auth-divider"><span>or</span></div>
    <a href="/" class="btn btn-secondary w-full" style="justify-content:center;font-size:0.85rem;padding:12px;border-radius:12px">
      ← Back to Home
    </a>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
