{% extends "base.html" %}
{% block title %}Forgot Password — ResumeMatch.ai{% endblock %}
{% block guest_content %}
<style>
 .auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
 .auth-card{width:100%;max-width:420px;padding:44px;background:rgba(255,255,255,0.05);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,0.4)}
 .input-icon-wrap{position:relative}.input-icon-wrap .form-control{padding-left:44px}
 .input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
</style>
<div class="auth-page">
 <div class="auth-card">
 <div style="text-align:center;margin-bottom:32px">
 <div style="font-size:1.5rem;font-weight:800;margin-bottom:8px">Forgot Password?</div>
 <div style="color:var(--text-muted);font-size:0.875rem">Enter your email and we'll verify your identity.</div>
 </div>
 <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="loading-form">
 <div class="form-group">
 <label class="form-label" for="email">Email Address</label>
 <div class="input-icon-wrap">
 <span class="input-icon"></span>
 <input type="email" id="email" name="email" class="form-control" placeholder="you@company.com" required>
 </div>
 </div>
 <button type="submit" class="btn btn-primary w-full" style="justify-content:center">Verify Identity</button>
 </form>
 <div style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--text-muted)">
 Remembered it? <a href="{{ url_for('auth.login') }}" style="color:var(--primary-light);font-weight:600">Back to Login</a>
 </div>
 </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
