{% extends "base.html" %}
{% block title %}Change Password — ResumeMatch.ai{% endblock %}
{% block content %}
<div class="page-header">
 <div><h1 class="page-title"> Change Password</h1><p class="page-subtitle">Update your account password</p></div>
</div>
<div style="max-width:500px">
 <div class="glass-card p-24">
 <form method="POST" action="{{ url_for('auth.change_password') }}" class="loading-form">
 <div class="form-group">
 <label class="form-label">Current Password</label>
 <input type="password" name="current_password" class="form-control" placeholder="Your current password" required>
 </div>
 <div class="divider"></div>
 <div class="form-group">
 <label class="form-label">New Password</label>
 <input type="password" name="new_password" class="form-control" placeholder="Min 8 characters" required>
 </div>
 <div class="form-group">
 <label class="form-label">Confirm New Password</label>
 <input type="password" name="confirm_password" class="form-control" placeholder="Repeat new password" required>
 </div>
 <div style="display:flex;gap:12px">
 <button type="submit" class="btn btn-primary">Update Password</button>
 <a href="{{ url_for('auth.profile') }}" class="btn btn-secondary">Cancel</a>
 </div>
 </form>
 </div>
</div>
{% endblock %}
