{% extends "base.html" %}
{% block title %}Edit JD — ResumeMatch.ai{% endblock %}
{% block content %}
<div class="page-header fade-in">
 <div><h1 class="page-title">️ Edit Job Description</h1><p class="page-subtitle">Update the job details</p></div>
 <a href="{{ url_for('jd.list_jds') }}" class="btn btn-secondary">← Back</a>
</div>
<div style="max-width:720px">
 <div class="glass-card p-24 fade-in">
 <form method="POST" action="{{ url_for('jd.edit', jd_id=jd.id) }}" class="loading-form">
 <div class="form-group">
 <label class="form-label">Job Title *</label>
 <input type="text" name="title" class="form-control" value="{{ jd.title }}" required>
 </div>
 <div class="form-group">
 <label class="form-label">Company</label>
 <input type="text" name="company" class="form-control" value="{{ jd.company or '' }}">
 </div>
 <div class="form-group">
 <label class="form-label">Job Description *</label>
 <textarea name="description" class="form-control" rows="12" required>{{ jd.description }}</textarea>
 </div>
 <div class="form-group">
 <label class="form-label">Additional Requirements</label>
 <textarea name="requirements" class="form-control" rows="4">{{ jd.requirements or '' }}</textarea>
 </div>
 <div style="display:flex;gap:12px">
 <button type="submit" class="btn btn-primary"> Update</button>
 <a href="{{ url_for('jd.list_jds') }}" class="btn btn-secondary">Cancel</a>
 </div>
 </form>
 </div>
</div>
{% endblock %}
